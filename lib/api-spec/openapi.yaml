      required: [results, total]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"
        total:
          type: integer

    # ── ADMIN SCHEMAS ───────────────────────────────────────────────────────────
    AuditLog:
      type: object
      required: [id, action, entityType, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: ["integer", "null"]
        userName:
          type: ["string", "null"]
        action:
          type: string
        entityType:
          type: string
        entityId:
          type: ["integer", "null"]
        description:
          type: string
        oldValue:
          type: ["string", "null"]
        newValue:
          type: ["string", "null"]
        ipAddress:
          type: ["string", "null"]
        createdAt:
          type: string

    AuditLogListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AuditLog"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    LoginLog:
      type: object
      required: [id, userId, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        userName:
          type: ["string", "null"]
        userEmail:
          type: ["string", "null"]
        ipAddress:
          type: ["string", "null"]
        userAgent:
          type: ["string", "null"]
        status:
          type: string
        createdAt:
          type: string

    LoginLogListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/LoginLog"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    AppSettings:
      type: object
      required: [id, appName, updatedAt]
      properties:
        id:
          type: integer
        appName:
          type: string
        appLogo:
          type: ["string", "null"]
        primaryColor:
          type: string
        timezone:
          type: string
        currency:
          type: string
        emailNotifications:
          type: boolean
        updatedAt:
          type: string

    AppSettingsUpdate:
      type: object
      properties:
        appName:
          type: string
        primaryColor:
          type: string
        timezone:
          type: string
        currency:
          type: string
        emailNotifications:
          type: boolean

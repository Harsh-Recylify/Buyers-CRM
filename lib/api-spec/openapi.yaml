components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    PaginationMeta:
      type: object
      required: [total, page, limit, totalPages]
      properties:
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer

    # ── AUTH SCHEMAS ────────────────────────────────────────────────────────────
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        rememberMe:
          type: boolean

    RegisterInput:
      type: object
      required: [name, email, password, role]
      properties:
        name:
          type: string
          minLength: 2
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        role:
          type: string

    ForgotPasswordInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    ResetPasswordInput:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 6

    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 6

    ProfileUpdate:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        department:
          type: string
        avatar:
          type: string

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"

    Invitation:
      type: object
      required: [id, email, role, status, token, inviteUrl, expiresAt, createdAt]
      properties:
        id:
          type: integer
        email:
          type: string
        role:
          type: string
        department:
          type: ["string", "null"]
        status:
          type: string
        token:
          type: string
        inviteUrl:
          type: string
        invitedByName:
          type: ["string", "null"]
        acceptedAt:
          type: ["string", "null"]
        expiresAt:
          type: string
        createdAt:
          type: string

    InvitationListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Invitation"

    InvitationInput:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          type: string
        department:
          type: string

    InvitationVerifyResponse:
      type: object
      required: [email, role, valid]
      properties:
        email:
          type: string
        role:
          type: string
        department:
          type: ["string", "null"]
        invitedByName:
          type: ["string", "null"]
        valid:
          type: boolean

    AcceptInvitationInput:
      type: object
      required: [token, name, password]
      properties:
        token:
          type: string
        name:
          type: string
          minLength: 2
        password:
          type: string
          minLength: 6
        phone:
          type: string

    User:
      type: object
      required: [id, name, email, role, status, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
        status:
          type: string
        phone:
          type: ["string", "null"]

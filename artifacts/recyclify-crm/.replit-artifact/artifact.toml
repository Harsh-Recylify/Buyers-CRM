kind = "web"
previewPath = "/"
title = "Recyclify Bidder Market"
version = "1.0.0"
id = "artifacts/recyclify-crm"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20617

[services.development]
run = "pnpm --filter @workspace/recyclify-crm run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/recyclify-crm", "run", "build" ]
publicDir = "artifacts/recyclify-crm/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20617"
BASE_PATH = "/"

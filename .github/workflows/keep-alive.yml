name: Keep Render service warm

# Render's free plan spins the service down after ~15 minutes of no traffic,
# and the next visitor eats a ~30-60s cold start. Pinging the health endpoint
# every 10 minutes keeps it warm so real visitors never hit that delay.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -fsS --max-time 30 "https://www.recyclifycrm.in/api/healthz" \
            && echo "Service is warm" \
            || echo "Ping failed (service may be mid cold-start, non-fatal)"
